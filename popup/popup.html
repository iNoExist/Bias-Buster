<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bias Buster</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/98.css/dist/98.css">
  <link rel="stylesheet" href="popup.css">

  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">Bias Buster</div>
      <div class="title-bar-controls">
        <button aria-label="Close" id="close-btn"></button>
      </div>
    </div>
    <div class="window-body">
      <div class="tabs">
        <button class="tab-button" id="scan-tab">Bias Scanner</button>
        <button class="tab-button" id="ai-tab">AI Bias Score</button>
      </div>

      <div class="tab-content" id="scan-tab-content">
        <p id="status">Click the button to scan and replace biased language.</p>
        <button id="scan" class="btn">Run Bias Buster</button>
      </div>

      <div class="tab-content" id="ai-tab-content" style="display: none;">
        <h3>AI Bias Score</h3>
        <p id="ai-summary">Loading...<br>Summary will be displayed here.</p>
      </div>
    </div>
  </div>
</body>
<script src="popup.js"></script>
</html>
